name: CI/CD Pipeline - ArenaMatch

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Testes e Build do Backend
  # ─────────────────────────────────────────────────────────────────────────────
  test-and-build-backend:
    name: "🧪 Testes e Build - Backend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backArenaMatch

    services:
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4

      - name: "☕ Configurar JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: "🧪 Rodar testes unitários e de integração"
        run: mvn test -B

      - name: "📦 Build do artefato JAR"
        run: mvn package -DskipTests -B

      - name: "📤 Upload do JAR como artefato"
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backArenaMatch/target/*.jar

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build do Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: "🎨 Build - Frontend React"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontArenaMatch

    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4

      - name: "🟢 Configurar Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontArenaMatch/package-lock.json

      - name: "📦 Instalar dependências"
        run: npm ci

      - name: "🔍 Lint"
        run: npm run lint --if-present

      - name: "🏗️ Build de produção"
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build e Push de Imagens Docker (somente na branch main)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: "🐳 Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [test-and-build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4

      - name: "🔑 Login no Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "🏗️ Build e Push - Backend"
        uses: docker/build-push-action@v6
        with:
          context: ./backArenaMatch
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/arenamatch-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/arenamatch-backend:${{ github.sha }}

      - name: "🏗️ Build e Push - Frontend"
        uses: docker/build-push-action@v6
        with:
          context: ./frontArenaMatch
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/arenamatch-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/arenamatch-frontend:${{ github.sha }}
