spring.application.name=arenamatch

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:arenamatchdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Recria o banco sempre que rodar e mostra o SQL no terminal
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Habilitar o console web do H2 para você inspecionar o banco (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console