spring.application.name=arenamatch

# Configuracao do H2 Database
spring.datasource.url=jdbc:h2:mem:arenamatchdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ (sobrescrito por variaveis de ambiente no Docker/K8s)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Spring Actuator (Health Checks para Docker e Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
